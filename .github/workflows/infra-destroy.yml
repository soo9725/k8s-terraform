name: Scheduled Infra Destroy

on:
  schedule:
    - cron: '0 9 * * *' # 매일 KST 18:00 (UTC 09:00) 실행
  workflow_dispatch: 

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Destroy 실행 전에도 동일하게 파일을 임시로 생성해 줍니다.
      - name: Inject SSH Keys
        run: |
          # 1. SSH 설정 폴더를 만듭니다.
          mkdir -p ~/.ssh 
          
          # 2. Secrets에 저장된 공개키(.pub) 값을 파일로 만듭니다.
          echo "${{ secrets.BASTION_PUBLIC_KEY }}" > ~/.ssh/bastion_key.pub 
          # 공개키 파일의 권한을 '소유자는 읽기/쓰기, 나머지는 읽기'로 설정합니다.
          chmod 644 ~/.ssh/bastion_key.pub 
          
          # 3. Secrets에 저장된 개인키 값을 파일로 만듭니다.
          echo "${{ secrets.BASTION_PRIVATE_KEY }}" > ~/.ssh/bastion_key 
          # [핵심 보안] 개인키는 '나(소유자)'만 읽을 수 있도록 권한을 매우 엄격하게 600으로 설정해야 SSH 접속이 거부되지 않습니다.
          chmod 600 ~/.ssh/bastion_key

      - name: Grant Execute Permission
        run: chmod +x ./destroy_all.sh

      - name: Run Destroy All Script
        run: ./destroy_all.sh
        # [수정됨] 리소스를 삭제(Destroy)할 때도 인증 토큰이 필요하므로 동일하게 변수를 넣어줍니다.
        env:
          TF_VAR_slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          TF_VAR_slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          TF_VAR_slack_app_token: ${{ secrets.SLACK_APP_TOKEN }}

      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()