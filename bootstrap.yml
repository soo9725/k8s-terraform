# bootstrap.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/soo9725/k8s-terraform.git 
    targetRevision: main
    path: 05-app  # 사용자님의 실제 폴더명
  destination:
    server: https://kubernetes.default.svc
    #namespace: 
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas # ArgoCD가 replicas 값의 차이를 무시하도록 설정
  syncPolicy:
    automated:
      prune: true
      selfHeal: true