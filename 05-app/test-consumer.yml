apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-test-consumer
  namespace: default
spec:
  # KEDA가 제어하므로 초기 replicas는 1로 시작합니다.
  replicas: 1
  selector:
    matchLabels:
      app: kafka-test-consumer
  template:
    metadata:
      labels:
        app: kafka-test-consumer
    spec:
      containers:
      - name: consumer
        # Kafka CLI 도구가 포함된 공식 Strimzi 이미지 사용
        image: quay.io/strimzi/kafka:0.43.0-kafka-3.8.0
        command: ["/bin/sh", "-c"]
        # 지정된 토픽에서 메시지를 실시간으로 읽어 로그로 출력하는 명령
        args: 
          - |
            bin/kafka-console-consumer.sh \
            --bootstrap-server my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092 \
            --topic webapp-log-topic \
            --group python-app-group
        
        resources:
          # [핵심] Karpenter가 노드 부족을 감지하도록 보수적으로 설정
          requests:
            cpu: "500m"      # 사용자 요청: 최소 500m
            memory: "2Gi"    # 사용자 요청: 최소 2Gi
          limits:
            cpu: "1000m"     # 사용자 요청: 최대 1000m
            memory: "4Gi"    # 사용자 요청: 최대 4Gi

      # [Karpenter 최적화] Spot 인스턴스 우선 활용 (비용 절감)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: karpenter.sh/capacity-type
                operator: In
                values:
                - spot