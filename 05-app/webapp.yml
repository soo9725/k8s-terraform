apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: python-web
        image: harbor.soo9725.site/library/python-app:23
        # [핵심] 컨테이너가 죽지 않고 웹 서버 역할을 하도록 명령 추가
        command: ["/bin/sh", "-c"]
        args:
          - echo "Hello from Init Container" > index.html && python3 -m http.server 8000
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "500Mi"
            cpu: "250m"
          limits:
            memory: "750Mi"
            cpu: "500m"
      
      # [추가] "나는 Spot 인스턴스를 선호해!" (비용 절감)
      # 강제(Required)가 아니라 선호(Preferred)이므로, 
      # Spot 재고가 없으면 On-Demand에도 뜰 수 있음 (유연성 확보)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: karpenter.sh/capacity-type
                operator: In
                values:
                - spot
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: default
spec:
  selector:
    app: python-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  # ALB Ingress와 연결하기 위해 NodePort 사용 (ClusterIP도 가능하나 기존 유지)
  type: NodePort